name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build typecheck test lint
      - name: Prisma schema hợp lệ
        run: pnpm --filter @subca/api exec prisma validate
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
